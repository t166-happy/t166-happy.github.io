  <h1>OSEP-RABBONI 體感程式設計平台</h1>
  <p>這是公開測試版。可使用 Scratch 編輯器、Rabboni USB 體感積木及 micro:bit USB 積木。</p>
  <p><a class="button" href="./OSEP-RABBONI/">進入程式編輯器</a></p>
  <p><a href="https://raw.githubusercontent.com/t166-happy/t166-happy.github.io/main/OSEP-RABBONI/examples/rabboni-microbit-servo.sb3">下載 Rabboni 控制 micro:bit 伺服馬達範例（.sb3）</a>；下載後在編輯器選「檔案 → 從電腦中載入」。</p>
  <div class="note">
    <strong>使用前請留意：</strong>Rabboni 網頁直連需要桌面版 Chrome 或 Edge 與 USB 裝置。micro:bit v1／v2 韌體尚未完成實體板驗證，韌體檔暫不公開。KNN 功能暫緩；藍牙連線尚未加入。
